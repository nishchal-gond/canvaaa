<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LPH Sales Display</title>
    <meta name="description" content="Automated Sales Floor Display Management System for LG 98 Commercial Display" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121110" />
    <link rel="icon" type="image/png" href="/lph-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for service worker updates every 30 seconds
            setInterval(() => {
              reg.update().catch(() => {});
            }, 30000);
          }).catch(err => {
            console.log('Service Worker registration skipped or failed:', err);
          });
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // When service worker updates, cleanly reload page to activate new app version
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
